# Cuts a release from main with the shared bun-npm-release workflow: bumps the version, updates
# CHANGELOG.md, commits and tags it, publishes to npm and creates the GitHub Release.
# Run it from the Actions tab.
# npm trusted publishing (OIDC) matches this workflow by file name, so keep it `release.yml`.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 1.2.3. Leave empty to work it out from the commits.
        required: false
        type: string
      publish-only:
        description: Only publish the already tagged version above, e.g. after npm rejected the publish.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  # OIDC token for npm trusted publishing and provenance.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: BrianEstrada/.github/.github/workflows/bun-npm-release.yml@7127b39d86cea984c8de0fe0e5e0d81766c30706 # main
    with:
      version: ${{ inputs.version }}
      publish-only: ${{ inputs.publish-only }}
    secrets:
      app-client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
