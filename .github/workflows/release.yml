# Cuts a release from main: publishes to npm, then tags the commit and creates the GitHub Release
# with notes from git-cliff. Run it from the Actions tab.
# npm trusted publishing (OIDC) matches this workflow by file name, so keep it `release.yml`.
# main's ruleset blocks bot pushes, so there's no release commit: the tag comes from the Releases API,
# and package.json's version is bumped only on the runner, for the publish.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 0.2.0. Leave empty to work it out from the commits.
        required: false
        type: string

permissions:
  # Create the tag and the GitHub Release.
  contents: write
  # OIDC token for npm trusted publishing and provenance.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # git-cliff reads every commit and tag since the last release.
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      # Trusted publishing needs npm 11.5.1 or later, which current LTS Node ships.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - name: Pick the version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          # The latest tag, not package.json: its version stays put on main.
          latest="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2> /dev/null || true)"
          if [ -n "$REQUESTED" ]; then
            version="${REQUESTED#v}"
          else
            version="$(bunx git-cliff --bumped-version)"
            version="${version#v}"
          fi
          if ! echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "\"$version\" isn't a version like 1.2.3" >&2
            exit 1
          fi
          # git-cliff returns the latest version when every commit since it is skipped (deps, chores).
          if [ "v$version" = "$latest" ]; then
            echo "Nothing to release: no feat, fix, perf, docs or breaking commits since $latest" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "Tag v$version already exists" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Bump package.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bun pm version "$VERSION" --no-git-tag-version

      - run: bun run check

      # Before the tag, so a failed publish (e.g. a trusted publisher mismatch) can just be re-run.
      - run: npm publish

      - name: Create the GitHub Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bunx git-cliff --unreleased --tag "v$VERSION" --strip all > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
