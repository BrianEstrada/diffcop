# Reviews this repo's PRs with the action at the repo root (action.yml), so each PR tests its own action.yml.
# Needs one repo secret: ANTHROPIC_API_KEY, or CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`).
name: Review

on:
  pull_request:
    # edited covers a retargeted base, and title or body edits for the description re-check.
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  # Title and body edits get a group of their own, so a re-check can't cancel a review of the code.
  group: review-${{ github.event.pull_request.number }}${{ github.event.action == 'edited' && !github.event.changes.base && '-edit' || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Fork PRs don't get secrets, so there's nothing to authenticate with. Renovate's PRs run updated
    # dependencies' code, which shouldn't see the Claude secrets.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'renovate[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history so the CLI can find the merge base with the PR's base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Other repos use BrianEstrada/diffcop@main here instead.
      - uses: ./
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
